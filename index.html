<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glimmerveil Courts TCG</title>
    <style>
        body {
            background-color: #08090d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            margin: 0;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        .btn {
            background: #d4af37;
            color: #000;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }
        .btn-secondary {
            background: #2c3e50;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #12141d;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            padding: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .card h3 {
            margin: 0.5rem 0;
            font-size: 1.2rem;
        }
        .card span {
            color: #d4af37;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>The Glimmerveil Courts</h1>
    <p>An evolution-driven trading card game on the WAX Blockchain. Blend your way to the apex Divine Court.</p>
    
    <div class="btn-container">
        <a href="https://wax.mintyblocks.com/mintyblocks/drops?collection=glimmercourt" target="_blank" class="btn">Mintyblocks Blends</a>
        <a href="https://wax.atomichub.io/explorer/collection/wax-mainnet/glimmercourt#more-info" target="_blank" class="btn btn-secondary">AtomicHub Collection</a>
    </div>

    <div class="grid" id="cardGrid">
        <!-- Cards injected via script -->
    </div>

    <script>
        const cards = [
            { name: "Changeling", rarity: "Common (0.5 WAX)", recipe: "3 Changelings → 1 Pixie", hash: "bafkreignxsl47yd3tn25czpydzjvtxvjbje5hecanczpljetluad67oirq" },
            { name: "Pixie", rarity: "Uncommon", recipe: "3 Pixies → 1 Selkie", hash: "bafkreifqaaqas62qrclshopenuk4jcznvxnob7hf4q275bwkxfwpt5bytu" },
            { name: "Selkie", rarity: "Rare", recipe: "4 Selkies → 1 Kelpie", hash: "bafkreibnlbgzacwb3gadinciljfzpnhxzwwiosuo5pjpr75cjr2uipgw4m" },
            { name: "Kelpie", rarity: "Epic", recipe: "4 Kelpies → 1 Redcap", hash: "bafkreiah5qtkio2tduyl2jzu3baahfl6j4zdmfrq6ldsvt3faflyw3iyom" },
            { name: "Redcap", rarity: "Legendary", recipe: "4 Redcaps → 1 Dryad", hash: "bafkreifbppnnlrvyg2yzgw7kssv57h7ryryh733vtg63sniwdk6xe6rqsq" },
            { name: "Dryad", rarity: "Mythic", recipe: "5 Dryads → 1 Titania", hash: "bafkreieoy4aoqtlicjhwifhf2gce54u2q2h4lyci5uhe67wv425eirb5rm" },
            { name: "Titania, Queen of the High Court", rarity: "Divine (Capped 100)", recipe: "Apex Monarch", hash: "bafkreiejraa5eetialvpp7rpac5gzoe24n4vw36rn7kgb7m4c7wport5ee" }
        ];

        const grid = document.getElementById("cardGrid");
        cards.forEach(c => {
            grid.innerHTML += `
                <div class="card">
                    <img src="https://silver-regulatory-giraffe-176.mypinata.cloud/ipfs/${c.hash}" alt="${c.name}" onerror="this.src='https://ipfs.io/ipfs/${c.hash}'">
                    <h3>${c.name}</h3>
                    <p style="color:#fff; margin:0.2rem 0;">${c.rarity}</p>
                    <span>Recipe: ${c.recipe}</span>
                </div>
            `;
        });
    </script>

</body>
</html>
