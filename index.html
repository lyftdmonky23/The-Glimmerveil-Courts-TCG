<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Glimmerveil Courts TCG - Collection Showcase</title>

    <style>
        :root {
            --bg-dark: #08090d;
            --card-bg: #12141d;
            --accent-gold: #d4af37;
            --common-color: #a0a5b5;
            --uncommon-color: #2ecc71;
            --rare-color: #3498db;
            --epic-color: #9b59b6;
            --legendary-color: #e67e22;
            --mythic-color: #f1c40f;
            --divine-color: #e8f4f8;
            --divine-glow: rgba(232, 244, 248, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:

                radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 3rem 1rem 1.5rem;
            position: relative;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 1.5rem;
            font-weight: 300;
        }

        .cta-container {
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            padding: 0.85rem 1.8rem;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ebd06a 0%, #c5931d 100%);
        }
